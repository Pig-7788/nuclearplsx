<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>辟谣者联盟：核能纪元</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ===== 欢迎界面 ===== -->
  <div id="welcome">
    <h1>⚛️ 辟谣者联盟：核能纪元</h1>
    <div class="game-btn btn-big" onclick="startGame()">
      ▶ &nbsp;开 始 游 戏
    </div>
  </div>

  <!-- ===== 模式选择界面 ===== -->
  <div id="modeSelect" style="display:none;">
    <h2>🎮 选 择 模 式</h2>
    <div class="btn-group">
      <div class="mode-card rumor-card" onclick="enterMode('rumor')">
        <div class="mode-icon">🔍</div>
        <div class="mode-label">打假模式</div>
        <div class="mode-desc">识破谣言<br>科普核能知识</div>
      </div>
      <div class="mode-card city-card" onclick="enterMode('city')">
        <div class="mode-icon">🏗️</div>
        <div class="mode-label">市长模式</div>
        <div class="mode-desc">建造核电站<br>了解内部结构</div>
      </div>
    </div>
  </div>

  <!-- ===== 游戏主界面 ===== -->
  <div id="gameUI" style="display:none;">
    <div id="topBar">
      <span id="scoreText">分数：0</span>
      <div id="switchModeBtn" onclick="switchMode()">🔄 切换模式</div>
    </div>

    <div id="mainArea"></div>

    <div id="cardArea"></div>
  </div>

  <!-- ===== 弹框 ===== -->
  <div id="popup" style="display:none;" class="popup">
    <div id="popupContent"></div>
    <button onclick="nextLevel()">继 续 ▶</button>
  </div>

  <script src="rumors.js"></script>
  <script src="city.js"></script>
  <script src="main.js"></script>
</body>
</html>
